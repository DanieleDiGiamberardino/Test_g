<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DERELICT // 3D Salvage Idle</title>
  </head>
  <body>
    <div id="canvas-container"></div>

    <div id="hud">
      <!-- BARRA SUPERIORE -->
      <header class="hud-panel top-bar">
        <div class="brand">
          <span class="dot"></span>
          <strong>DERELICT</strong>
          <span id="sector-badge" class="badge-sector">HANGAR</span>
        </div>

        <div class="resources">
          <div class="res"><span>SCAFO</span><strong id="val-hull">100/100</strong></div>
          <div class="res"><span>FUEL</span><strong id="val-fuel">100/100</strong></div>
          <div class="res accent"><span>ROTTAMI</span><strong id="val-scrap">50</strong></div>
          <div class="res alien"><span>NUCLEI</span><strong id="val-cores">0</strong></div>
        </div>

        <div class="controls-right">
          <div class="audio-wrap">
         <button id="btn-mute" title="Audio ON/OFF">🔊</button>
         <button id="btn-mixer" title="Mixer Audio">🎚️</button>
         <div id="audio-mixer" class="mixer-popover hidden">
           <label><span>MUSICA</span><input type="range" id="vol-music" min="0" max="1" step="0.05" /></label>
           <label><span>EFFETTI</span><input type="range" id="vol-sfx" min="0" max="1" step="0.05" /></label>
           <label><span>MOTORI</span><input type="range" id="vol-engine" min="0" max="1" step="0.05" /></label>
         </div>
       </div>
          <button id="btn-aimode" class="btn-ai">AUTO (60s)</button>
          <select id="sel-protocol" class="select-proto">
            <option value="cauto">IA: CAUTO</option>
            <option value="avido">IA: AVIDO</option>
            <option value="sopravvivenza">IA: SOPRAVV.</option>
          </select>
          <div class="speed-group">
            <button class="btn-speed active" data-speed="1">1x</button>
            <button class="btn-speed" data-speed="2">2x</button>
            <button class="btn-speed" data-speed="3">3x</button>
          </div>
        </div>
      </header>

      <!-- AREA CENTRALE (SINISTRA + DESTRA, CENTRO LIBERO PER IL 3D) -->
      <div class="middle-row">
        <!-- REATTORE -->
        <aside class="hud-panel left-panel">
          <div class="panel-title">
            <span>REATTORE</span>
            <span id="power-free" class="sub-tag">LIBERI: 0</span>
          </div>
          <div id="reactor-controls" class="reactor-list"></div>

          <hr />
          <div class="panel-title"><span>PROGRESSO NODO</span></div>
          <div class="progress-wrap">
            <div id="node-bar" class="progress-fill"></div>
          </div>
          <div id="node-label" class="hint">In attesa di lancio...</div>
          <hr />
          <div class="panel-title">
            <span>TRACCIA TERMICA</span>
            <span id="val-heat" class="sub-tag">0%</span>
          </div>
          <div class="progress-wrap">
            <div id="heat-bar" class="progress-fill heat-fill"></div>
          </div>
          <button id="btn-ghost" class="btn-ghost">👻 MODALITÀ FANTASMA</button>
          <hr />
          <div class="panel-title"><span>EQUIPAGGIO</span></div>
          <div id="crew-list" class="crew-list"></div>

        </aside>
        <!-- TELEMETRIA LOG -->
        <aside class="hud-panel right-panel">
          <div class="panel-title">
            <span>RELIQUIE RUN</span>
            <span id="relic-count" class="sub-tag">0/3</span>
          </div>
          <div id="relic-list" class="relic-list"></div>
          <hr />
          <div class="panel-title">
            <span>TELEMETRIA</span>
            <button id="btn-reset" class="btn-mini">RESET</button>
          </div>
          <div id="log-feed" class="log-feed"></div>
        </aside>
      </div> <!-- <--- ASSICURATI CHE CI SIA QUESTO -->

      <!-- DOCK INFERIORE (HANGAR / DILEMMA / FINE SETTORE) -->
      <footer id="bottom-dock" class="hud-panel bottom-dock"></footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
